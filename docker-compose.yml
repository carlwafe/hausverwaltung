# Mietverwaltung Eutin auf dem eigenen Server — Anleitung: docs/mini-pc.md
# Die Werte (${…}) stehen in der Datei `.env` neben dieser Datei (git-ignoriert, Vorlage: .env.server.example).
# Die Zeitzone der Container bleibt UTC — wie auf Vercel.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mietverwaltung
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mietverwaltung
    volumes:
      - ./daten/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mietverwaltung -d mietverwaltung"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mietverwaltung:${POSTGRES_PASSWORD}@db:5432/mietverwaltung
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Schlüssel des Startseiten-Zwischenspeichers (src/lib/startseite-cache.ts): neu bei jedem Update
      VERCEL_GIT_COMMIT_SHA: ${APP_VERSION:-lokal}
    volumes:
      - ./daten/storage:/app/var/storage
    # Nur lokal erreichbar; von außen kommt man über den Cloudflare Tunnel (Dienst unten).
    ports:
      - "127.0.0.1:3000:3000"

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - app
